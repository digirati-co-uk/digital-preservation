version: 2
updates:
  # Review feedback on #427: pinning the ASP.NET base images to an exact patched tag (10.0.14,
  # fixing CVE-2026-111497/GHSA-p3jp-9v83-76w9) closes the gap a floating 10.0 tag left - no proof
  # a given build actually got the patched runtime - but trades it for a different one: nothing
  # now bumps that pin when the next patch ships. Watching the Dockerfiles here (all six live at
  # the repo root) is what keeps the pin itself a live, maintained version rather than a one-time
  # fix that quietly goes stale.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    # .NET 10 is the LTS release we stay on (supported to November 2028); .NET 11 is an STS
    # release. Dependabot treats 10.0.14 -> 11.0.0 as just another tag bump (#476, #477), so
    # major versions are ignored here: moving the runtime is a deliberate decision, made together
    # with the TargetFramework change, not something an automated PR proposes. Minor and patch
    # bumps still come through, which is what keeps the pinned 10.0.x tags patched.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
