name: Build, Test & Publish dotnet Images

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
    types: [ opened, synchronize, reopened, ready_for_review ]
  workflow_dispatch:
    inputs:
      environment:
        description: "environment"
        required: true
        default: "development"
        type: choice
        options:
          - development
          - test
          - production

jobs:
  # A workflow SKIPPED by an if: reports as Skipped, which satisfies a required status check; a
  # workflow never TRIGGERED (the old paths: filter) leaves that check Pending forever and blocks
  # the merge. This job exists so every PR triggers the workflow, and the dotnet jobs below skip
  # themselves via if: when nothing under these paths changed (issue #230).
  changes:
    runs-on: ubuntu-latest
    outputs:
      dotnet: ${{ steps.filter.outputs.dotnet }}
    steps:
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            dotnet:
              - 'src/DigitalPreservation/**'
              - '.github/**'
              - 'Dockerfile.*'

  sonar-cloud-analysis:
    name: SonarCloud Analysis
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.dotnet == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./src/DigitalPreservation/
    steps:
      - id: SetupJDK21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu' # See 'Supported distributions' for available options
          java-version: '21'
      - uses: actions/checkout@v4
        with:
         fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - id: CacheSonarCloudPackages
        uses: actions/cache@v4
        with:
          path: ~\sonar\cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - id: InstallSonarCloudScanners
        run: |
          dotnet tool install --global dotnet-sonarscanner
      - id: BuildAndAnalyze
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
         dotnet tool install --global dotnet-coverage
         dotnet-sonarscanner begin /k:"digirati-co-uk_digital-preservation" /o:"digirati" /d:sonar.token="${{ secrets.SONAR_TOKEN }}" /d:sonar.host.url="https://sonarcloud.io" /d:sonar.cs.vscoveragexml.reportsPaths=coverage.xml
         # Deliberately Debug (no --configuration): coverage is collected from this build, and
         # Release inlining/optimisation can mis-attribute or drop covered lines. The Release
         # build that matters for shipping is test-dotnet's, below.
         dotnet build
         dotnet-coverage collect "dotnet test --filter Category!=Manual" -f xml -o "coverage.xml"
         dotnet-sonarscanner end  /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

  test-dotnet:
    needs: changes
    if: (github.event_name != 'pull_request' || needs.changes.outputs.dotnet == 'true') && github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./src/DigitalPreservation/
    env:
      BUILD_CONFIG: "Release"
      SOLUTION: "DigitalPreservation.sln"
    steps:
      - id: checkout
        uses: actions/checkout@v4
      - id: setup-dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - id: restore-dotnet-dependencies
        run: dotnet restore $SOLUTION
      - id: build-dotnet
        run: dotnet build $SOLUTION --configuration $BUILD_CONFIG --no-restore
      - id: test-dotnet
        run: dotnet test $SOLUTION --filter 'Category!=Manual' --configuration $BUILD_CONFIG --no-restore --no-build --verbosity normal

  build-push-images:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    needs: [changes, test-dotnet]
    if: github.event_name != 'pull_request' || needs.changes.outputs.dotnet == 'true'
    strategy:
      matrix:
        include:
          - image: "storage-api"
            dockerfile: "Dockerfile.StorageApi"
          - image: "storage-api-importer"
            dockerfile: "Dockerfile.StorageApiImporter"
          - image: "preservation-api"
            dockerfile: "Dockerfile.PreservationApi"
          - image: "preservation-ui"
            dockerfile: "Dockerfile.UI"
          - image: "pipeline-api"
            dockerfile: "Dockerfile.PipelineApi"
          - image: "deposit-archiver"
            dockerfile: "Dockerfile.DepositArchiver"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/docker-build-and-push
        id: buildpush
        name: build and push
        with:
          image-name: ${{ matrix.image }}
          dockerfile: ${{ matrix.dockerfile }}
          iam-role: ${{ secrets.PUBLISH_IAM_ROLE }}
          ecr-prefix: ${{ vars.ECR_PREFIX }}
  
  deploy-environment:
    needs: [build-push-images]
    uses: ./.github/workflows/deploy.yml
    if: (github.event_name != 'pull_request' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'deploy')))
    with:
      image_tag: "${{ github.sha }}"
      target_env: "${{ inputs.environment || 'development' }}"
    secrets: inherit