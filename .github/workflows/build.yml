name: Build, Test & Publish dotnet Images

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
    types: [ opened, synchronize, reopened, ready_for_review ]
  workflow_dispatch:
    inputs:
      environment:
        description: "environment"
        required: true
        default: "development"
        type: choice
        options:
          - development
          - test
          - production

env:
  # AWS SDK v4 resolves credentials eagerly as soon as an AWS client (e.g. IAmazonS3) is
  # constructed via DI, rather than lazily on first real call (SDK v3's behaviour). Several
  # integration tests build a controller through that DI graph without ever calling AWS, and
  # this runner has no profile/role to resolve - these fake values satisfy the environment-
  # variable credential provider (the first one checked) so construction succeeds; nothing here
  # ever signs a real request.
  AWS_ACCESS_KEY_ID: "test-key-id"
  AWS_SECRET_ACCESS_KEY: "test-secret-key"

jobs:
  # A workflow SKIPPED by an if: reports as Skipped, which satisfies a required status check; a
  # workflow never TRIGGERED (the old paths: filter) leaves that check Pending forever and blocks
  # the merge. This job exists so every PR triggers the workflow, and the dotnet jobs below skip
  # themselves via if: when nothing under these paths changed (issue #230).
  changes:
    runs-on: ubuntu-latest
    outputs:
      dotnet: ${{ steps.filter.outputs.dotnet }}
      mets-editability: ${{ steps.filter.outputs.mets-editability }}
    steps:
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            dotnet:
              - 'src/DigitalPreservation/**'
              - '.github/**'
              - 'Dockerfile.*'
              # Not .NET, but built into the images: Dockerfile.PipelineApi copies clamscan-shim.sh and
              # pipeline-api-entrypoint.sh, and .dockerignore shapes every image's build context.
              - '*.sh'
              - '.dockerignore'
              # The .NET editability judge embeds the compiled Schematron from here.
              - 'src/mets-editability/**'
            mets-editability:
              - 'src/mets-editability/**'
              # The Python judge's acceptance corpus is XmlGen.Tests' sample set.
              - 'src/DigitalPreservation/XmlGen.Tests/Samples/**'
              # Copies the Python suite pins to their originals: the platform agent string and
              # the NCName tables.
              - 'src/DigitalPreservation/DigitalPreservation.Mets/Constants.cs'
              - 'src/mets-id-migration/app/ncname_ranges.json'
              - '.github/**'

  sonar-cloud-analysis:
    name: SonarCloud Analysis
    needs: changes
    # Dependabot runs get no SONAR_TOKEN, so the scanner fails at once; skip rather than show red.
    # Not a required check, so Skipped does not block the merge.
    if: (github.event_name != 'pull_request' || needs.changes.outputs.dotnet == 'true') && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./src/DigitalPreservation/
    steps:
      - id: SetupJDK21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu' # See 'Supported distributions' for available options
          java-version: '21'
      - uses: actions/checkout@v4
        with:
         fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      # Without this the job used whatever SDK ubuntu-latest ships, and from November 2026 that
      # is .NET 11, whose Debug build of the UI fails. global.json pins the 10.0 band (LTS).
      - id: setup-dotnet
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: src/DigitalPreservation/global.json
      - id: CacheSonarCloudPackages
        uses: actions/cache@v4
        with:
          path: ~\sonar\cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - id: InstallSonarCloudScanners
        run: |
          dotnet tool install --global dotnet-sonarscanner
      - id: BuildAndAnalyze
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
         dotnet tool install --global dotnet-coverage
         dotnet-sonarscanner begin /k:"digirati-co-uk_digital-preservation" /o:"digirati" /d:sonar.token="${{ secrets.SONAR_TOKEN }}" /d:sonar.host.url="https://sonarcloud.io" /d:sonar.cs.vscoveragexml.reportsPaths=coverage.xml
         # Deliberately Debug (no --configuration): coverage is collected from this build, and
         # Release inlining/optimisation can mis-attribute or drop covered lines. The Release
         # build that matters for shipping is test-dotnet's, below.
         dotnet build
         dotnet-coverage collect "dotnet test --filter Category!=Manual" -f xml -o "coverage.xml"
         dotnet-sonarscanner end  /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

  # The editability judge is a twin implementation: Python executes the Schematron sources
  # directly, .NET runs the committed compiled XSLT. This job is what stops them diverging:
  # it recompiles the .sch files and fails on any diff (a forgotten
  # tools/compile_schematron.py run), then runs the Python suite, whose acceptance table the
  # .NET suite (in test-dotnet) also enforces.
  test-mets-editability:
    needs: changes
    if: (github.event_name != 'pull_request' || needs.changes.outputs.mets-editability == 'true') && github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./src/mets-editability/
    steps:
      - id: checkout
        uses: actions/checkout@v4
      - id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: install-dependencies
        run: pip install -r requirements.txt
      - id: compiled-schematron-matches-source
        # Recompile, then fail on ANY difference from what is committed: a changed file, a new
        # one from a new .sch, or one the tool deleted because its .sch is gone. Staging first
        # is what makes new and deleted files show up in the diff.
        run: |
          python tools/compile_schematron.py
          git add --all -- schematron/compiled
          git diff --cached --exit-code HEAD -- schematron/compiled
      - id: run-tests
        run: python -m unittest tests -v

  test-dotnet:
    needs: changes
    if: (github.event_name != 'pull_request' || needs.changes.outputs.dotnet == 'true') && github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./src/DigitalPreservation/
    env:
      BUILD_CONFIG: "Release"
      SOLUTION: "DigitalPreservation.sln"
    steps:
      - id: checkout
        uses: actions/checkout@v4
      - id: setup-dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - id: restore-dotnet-dependencies
        run: dotnet restore $SOLUTION
      - id: build-dotnet
        run: dotnet build $SOLUTION --configuration $BUILD_CONFIG --no-restore
      - id: test-dotnet
        run: dotnet test --solution $SOLUTION --filter-not-trait 'Category=Manual' --configuration $BUILD_CONFIG --no-restore --no-build --verbosity normal

  build-push-images:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      # To name the pull request an image was built from (the docker-build-and-push action).
      pull-requests: read
    needs: [changes, test-dotnet]
    if: github.event_name != 'pull_request' || needs.changes.outputs.dotnet == 'true'
    strategy:
      matrix:
        include:
          - image: "storage-api"
            dockerfile: "Dockerfile.StorageApi"
          - image: "storage-api-importer"
            dockerfile: "Dockerfile.StorageApiImporter"
          - image: "preservation-api"
            dockerfile: "Dockerfile.PreservationApi"
          - image: "preservation-ui"
            dockerfile: "Dockerfile.UI"
          - image: "pipeline-api"
            dockerfile: "Dockerfile.PipelineApi"
          - image: "deposit-archiver"
            dockerfile: "Dockerfile.DepositArchiver"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/docker-build-and-push
        id: buildpush
        name: build and push
        with:
          image-name: ${{ matrix.image }}
          dockerfile: ${{ matrix.dockerfile }}
          iam-role: ${{ secrets.PUBLISH_IAM_ROLE }}
          ecr-prefix: ${{ vars.ECR_PREFIX }}
  
  deploy-environment:
    needs: [build-push-images]
    uses: ./.github/workflows/deploy.yml
    # A tag push (e.g. hotfix-tagging this release branch) has no workflow_dispatch inputs, so
    # target_env would silently fall back to 'development' - deploying whatever this branch
    # happens to be (potentially an older .NET/base-image build than main's current dev) over
    # dev's actual tracked state. v1.3.1's tag push on 22 September did exactly this harmlessly,
    # only because the tag matched main at the time; that won't be true of every tag push from
    # here on. Excluding tag refs here means a tag only builds and pushes images - an actual
    # deploy still needs an explicit workflow_dispatch run naming the target environment.
    if: (github.event_name != 'pull_request' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'deploy'))) && !(github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
    with:
      image_tag: "${{ github.sha }}"
      target_env: "${{ inputs.environment || 'development' }}"
    secrets: inherit