name: Build and Deploy IIIF Builder Services

on:
  workflow_call:
    inputs:
      image_tag:
        required: true
        type: string
      wait_services:
        required: false
        type: string
        default: 'false'
      target_env:
        required: true
        type: string
      deploy_dotnet:
        required: false
        default: 'true'
        type: string
      deploy_iiifbuilder:
        required: false
        default: 'false'
        type: string
    secrets:
      slack_webhook:
        required: true       

permissions:
  id-token: write  # required for OIDC / AWS
  contents: read   # This is required for actions/checkout

jobs:

  # NOTE - This suits a matrix but we cannot use it here as we need to read environment ${{vars}} for matrix setup but it's not available
  deploy-storage:
    if: (inputs.deploy_dotnet == 'true')
    runs-on: ubuntu-latest
    environment: 
      name: ${{ inputs.target_env }}
      url: ${{ vars.STORAGE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ecr-retag
        name: retag image
        with:
          source-image: ${{ vars.ECR_PREFIX }}/dlip-pres-storage-api
          source-tag: ${{ inputs.image_tag }}
          target-tag: ${{ inputs.target_env }}
          iam-role: ${{ secrets.PUBLISH_IAM_ROLE }}
      - uses: ./.github/actions/ecs-bounce
        name: bounce service
        with:
          target-ecs-service: ${{ vars.STORAGE_SERVICE }}
          target-ecs-cluster: ${{ vars.CLUSTER_NAME }}
          wait-for-services: ${{ inputs.wait_services }}
          role-arn: ${{ secrets.DEPLOY_IAM_ROLE }}

  deploy-storage-importer:
    if: (inputs.deploy_dotnet == 'true')
    runs-on: ubuntu-latest
    environment: 
      name: ${{ inputs.target_env }}
      url: ${{ vars.STORAGE_IMPORTER_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ecr-retag
        name: retag image
        with:
          source-image: ${{ vars.ECR_PREFIX }}/dlip-pres-storage-api-importer
          source-tag: ${{ inputs.image_tag }}
          target-tag: ${{ inputs.target_env }}
          iam-role: ${{ secrets.PUBLISH_IAM_ROLE }}
      - uses: ./.github/actions/ecs-bounce
        name: bounce service
        with:
          target-ecs-service: ${{ vars.STORAGE_IMPORTER_SERVICE }}
          target-ecs-cluster: ${{ vars.CLUSTER_NAME }}
          wait-for-services: ${{ inputs.wait_services }}
          role-arn: ${{ secrets.DEPLOY_IAM_ROLE }}

  deploy-preservation:
    if: (inputs.deploy_dotnet == 'true')
    runs-on: ubuntu-latest
    environment: 
      name: ${{ inputs.target_env }}
      url: ${{ vars.PRESERVATION_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ecr-retag
        name: retag image
        with:
          source-image: ${{ vars.ECR_PREFIX }}/dlip-pres-preservation-api
          source-tag: ${{ inputs.image_tag }}
          target-tag: ${{ inputs.target_env }}
          iam-role: ${{ secrets.PUBLISH_IAM_ROLE }}
      - uses: ./.github/actions/ecs-bounce
        name: bounce service
        with:
          target-ecs-service: ${{ vars.PRESERVATION_SERVICE }}
          target-ecs-cluster: ${{ vars.CLUSTER_NAME }}
          wait-for-services: ${{ inputs.wait_services }}
          role-arn: ${{ secrets.DEPLOY_IAM_ROLE }}

  deploy-preservation-ui:
    if: (inputs.deploy_dotnet == 'true')
    runs-on: ubuntu-latest
    environment: 
      name: ${{ inputs.target_env }}
      url: ${{ vars.PRESERVATION_UI_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ecr-retag
        name: retag image
        with:
          source-image: ${{ vars.ECR_PREFIX }}/dlip-pres-preservation-ui
          source-tag: ${{ inputs.image_tag }}
          target-tag: ${{ inputs.target_env }}
          iam-role: ${{ secrets.PUBLISH_IAM_ROLE }}
      - uses: ./.github/actions/ecs-bounce
        name: bounce service
        with:
          target-ecs-service: ${{ vars.PRESERVATION_UI_SERVICE }}
          target-ecs-cluster: ${{ vars.CLUSTER_NAME }}
          wait-for-services: ${{ inputs.wait_services }}
          role-arn: ${{ secrets.DEPLOY_IAM_ROLE }}

  deploy-iiif-builder:
    if: (inputs.deploy_iiifbuilder == 'true')
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_env }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ecr-retag
        name: retag image
        with:
          source-image: ${{ vars.ECR_PREFIX }}/dlip-pres-iiif-builder
          source-tag: ${{ inputs.image_tag }}
          target-tag: ${{ inputs.target_env }}
          iam-role: ${{ secrets.PUBLISH_IAM_ROLE }}
      - uses: ./.github/actions/ecs-bounce
        name: bounce service
        with:
          target-ecs-service: ${{ vars.IIIFBUILDER_SERVICE }}
          target-ecs-cluster: ${{ vars.CLUSTER_NAME }}
          wait-for-services: ${{ inputs.wait_services }}
          role-arn: ${{ secrets.DEPLOY_IAM_ROLE }}

  deploy-pipeline-api-builder:
    if: (inputs.deploy_dotnet == 'true')
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_env }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ecr-retag
        name: retag image
        with:
          source-image: ${{ vars.ECR_PREFIX }}/dlip-pres-pipeline-api 
          source-tag: ${{ inputs.image_tag }}
          target-tag: ${{ inputs.target_env }}
          iam-role: ${{ secrets.PUBLISH_IAM_ROLE }}
      - uses: ./.github/actions/ecs-bounce
        name: bounce service
        with:
          target-ecs-service: ${{ vars.PIPELINE_SERVICE }}
          target-ecs-cluster: ${{ vars.EC2_CLUSTER_NAME }}
          wait-for-services: ${{ inputs.wait_services }}
          role-arn: ${{ secrets.DEPLOY_IAM_ROLE }}     

  deploy-deposit-archiver-builder:
    if: (inputs.deploy_dotnet == 'true')
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_env }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ecr-retag
        name: retag image
        with:
          source-image: ${{ vars.ECR_PREFIX }}/dlip-pres-deposit-archiver
          source-tag: ${{ inputs.image_tag }}
          target-tag: ${{ inputs.target_env }}
          iam-role: ${{ secrets.PUBLISH_IAM_ROLE }}
      # The archiver is a Lambda, not an ECS service: retagging in ECR alone does not update it,
      # because Lambda resolves an image tag to a digest only at CreateFunction/UpdateFunctionCode
      # time, not on every invoke. This step forces that re-resolution. See issue #277.
      - uses: ./.github/actions/lambda-update-code
        name: update Lambda code
        with:
          function-name: ${{ vars.LAMBDA_ARCHIVER_NAME }}
          image-uri: ${{ vars.ECR_PREFIX }}/dlip-pres-deposit-archiver:${{ inputs.target_env }}
          role-arn: ${{ secrets.DEPLOY_IAM_ROLE }}