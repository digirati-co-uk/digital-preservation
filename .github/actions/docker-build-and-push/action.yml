name: Docker Build & Push
description: Composite GitHub Action to build and push Docker images to the ECR repository.

inputs:
  image-name:
    description: "Docker image prefix used to push to ECR."
    required: true
  dockerfile:
    description: "The Dockerfile to build and push."
    required: true
  context:
    description: "The context to use when building the Dockerfile."
    required: false
    default: "."
  iam-role:
    description: "AWS IAM role to assume for pushing to ECR"
    required: true
  ecr-prefix:
    description: "Prefix for ECR registry"
    required: true

runs:
  using: "composite"
  steps:
    - id: checkout
      uses: actions/checkout@v4

    - id: configure-aws-credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ inputs.iam-role }}
        aws-region: eu-west-1

    - id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2
  
    - id: docker-setup-buildx
      uses: docker/setup-buildx-action@v3

    - id: docker-meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ inputs.ecr-prefix }}/dlip-pres-${{ inputs.image-name }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,enable=true,prefix=,format=long
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}

    - id: docker-build-push
      uses: docker/build-push-action@v6
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        builder: ${{ steps.docker-setup-buildx.outputs.name }}
        tags: ${{ steps.docker-meta.outputs.tags }}
        labels: ${{ steps.docker-meta.outputs.labels }}
        push: ${{ github.actor != 'dependabot[bot]' }}
        # No attestations: push a plain image manifest, not a manifest list with an attestation in
        # it. Lambda rejects a list ("image manifest, config or layer media type ... is not
        # supported"), and since the runners moved to ubuntu-26.04, whose Docker uses the containerd
        # image store, ecr-retag's pull/tag/push carries the whole list over to the environment tag
        # the Deposit Archiver Lambda deploys from. The older Docker pushed only the image itself.
        provenance: false
        sbom: false
        # RUN steps use the runner's own network and DNS. On the BuildKit container's network,
        # apt-get in Dockerfile.PipelineApi could not resolve archive.ubuntu.com or
        # security.ubuntu.com, while dotnet restore in the same build resolved NuGet fine, so main
        # failed three times in a row and never deployed. setup-buildx already allows network.host.
        network: host