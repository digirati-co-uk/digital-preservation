volumes:
  preservation_postgres_data: {}
  storage_postgres_data: {}
  iiifbuilder_postgres_data: {}
  clamav_data: {}

services:
  db-preservation:
    image: postgres:14-alpine
    environment:
      - POSTGRES_PASSWORD=preservation
    ports:
      - "5433:5432"
    volumes:
      - preservation_postgres_data:/var/lib/postgresql/data
  db-storage:
    image: postgres:14-alpine
    environment:
      - POSTGRES_PASSWORD=storage
    ports:
      - "5434:5432"
    volumes:
      - storage_postgres_data:/var/lib/postgresql/data
  db-iiifbuilder:
    image: postgres:14-alpine
    environment:
      - POSTGRES_PASSWORD=iiifbuilder
    ports:
      - "5437:5432"
    volumes:
      - iiifbuilder_postgres_data:/var/lib/postgresql/data
  iiifbuilder:
    # image: dlip-iiif-builder:latest
    build:
      context: ./src/iiif-builder
      dockerfile: Dockerfile
    depends_on:
      - db-iiifbuilder
    env_file: src/iiif-builder/.env
  # Local clamd for testing against Pipeline.API without the reload-on-every-scan cost of a bare
  # clamscan. Exposed over TCP (3310) rather than the Unix socket the container/ECS setup uses -
  # see the note in clamd-daemon-ec2-setup.md, this does NOT exercise the exact same code path as
  # production (clamscan-shim.sh talks to a Unix socket, not TCP).
  clamav:
    image: clamav/clamav:stable
    ports:
      - "3310:3310"
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s